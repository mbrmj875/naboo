  <style id="splash-screen-style">
    html {
      height: 100%;
      background-color: #071A36;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: -webkit-fill-available;
      background-color: #071A36;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <script>
    // جسر تثبيت PWA لـ Flutter (Android/Chrome + كشف iOS/سطح المكتب).
    (function () {
      var deferredPrompt = null;
      var ua = (navigator.userAgent || "").toLowerCase();
      var isIos = /iphone|ipad|ipod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isAndroid = /android/.test(ua);

      function isStandalone() {
        return window.navigator.standalone === true
          || window.matchMedia("(display-mode: standalone)").matches
          || window.matchMedia("(display-mode: minimal-ui)").matches;
      }

      function platformHint() {
        if (isIos) return "ios";
        if (isAndroid) return "android";
        return "desktop";
      }

      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        deferredPrompt = e;
        try {
          window.dispatchEvent(new CustomEvent("naboo-pwa-installable"));
        } catch (_) {}
      });

      window.addEventListener("appinstalled", function () {
        deferredPrompt = null;
        try {
          window.dispatchEvent(new CustomEvent("naboo-pwa-installed"));
        } catch (_) {}
      });

      window.nabooPwa = {
        canInstall: function () {
          return deferredPrompt != null && !isStandalone();
        },
        isStandalone: isStandalone,
        platformHint: platformHint,
        promptInstall: function () {
          if (!deferredPrompt) {
            return Promise.resolve({ ok: false, reason: "unavailable" });
          }
          var promptEvent = deferredPrompt;
          deferredPrompt = null;
          return promptEvent.prompt().then(function () {
            return promptEvent.userChoice;
          }).then(function (choice) {
            var outcome = choice && choice.outcome ? choice.outcome : "dismissed";
            return { ok: outcome === "accepted", reason: outcome };
          }).catch(function () {
            return { ok: false, reason: "error" };
          });
        },
        dismissDismissedForDays: function (days) {
          try {
            var until = Date.now() + (Math.max(1, days || 14) * 24 * 60 * 60 * 1000);
            localStorage.setItem("naboo_pwa_banner_dismiss_until", String(until));
          } catch (_) {}
        },
        isBannerDismissed: function () {
          try {
            var raw = localStorage.getItem("naboo_pwa_banner_dismiss_until");
            if (!raw) return false;
            var until = parseInt(raw, 10);
            if (!until || isNaN(until)) return false;
            if (Date.now() >= until) {
              localStorage.removeItem("naboo_pwa_banner_dismiss_until");
              return false;
            }
            return true;
          } catch (_) {
            return false;
          }
        },
        clearBannerDismiss: function () {
          try { localStorage.removeItem("naboo_pwa_banner_dismiss_until"); } catch (_) {}
        }
      };

      if (isStandalone()) {
        document.documentElement.classList.add("pwa-standalone");
      }
    })();
  </script>

  <script>
    // عند نشر نسخة جديدة: امسح Service Worker والكاش ثم أعد التحميل.
    (function () {
      var BUILD_KEY = "naboo_web_build_id";
      var BUILD_URL = "naboo-build.json";

      function clearWebCaches() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (names) {
            names.forEach(function (n) { caches.delete(n); });
          });
        }
      }

      fetch(BUILD_URL, { cache: "no-store" })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var remoteId = data && data.build_id ? String(data.build_id) : "";
          if (!remoteId) return;
          var prevId = null;
          try { prevId = localStorage.getItem(BUILD_KEY); } catch (_) {}
          if (prevId && prevId !== remoteId) {
            try { localStorage.setItem(BUILD_KEY, remoteId); } catch (_) {}
            clearWebCaches();
            var url = new URL(window.location.href);
            url.searchParams.set("_v", remoteId.replace(/[:]/g, ""));
            window.location.replace(url.toString());
            return;
          }
          try { localStorage.setItem(BUILD_KEY, remoteId); } catch (_) {}
        })
        .catch(function () {});
    })();
  </script>

<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

</body>
