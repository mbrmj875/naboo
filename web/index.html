<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="NABOO — نظام إدارة الأعمال: فواتير، مخزون، عملاء، ديون، وأقساط.">
  <meta name="theme-color" content="#071A36">
  <meta name="format-detection" content="telephone=no">

  <!-- PWA — Android / Chrome -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- PWA — iOS Safari (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NABOO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>NABOO</title>
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style id="splash-screen-style">
    html {
      height: 100%;
      background-color: #071A36;
    }

    body {
      margin: 0;
      min-height: 100%;
      min-height: -webkit-fill-available;
      background-color: #071A36;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.body.style.background = "transparent";
    }
  </script>

  <script>
    // iOS standalone: منع التكبير بالقرص المزدوج داخل التطبيق المثبّت.
    (function () {
      var standalone = window.navigator.standalone === true
        || window.matchMedia("(display-mode: standalone)").matches;
      if (!standalone) return;
      document.documentElement.classList.add("pwa-standalone");
    })();
  </script>

  <script>
    // عند نشر نسخة جديدة: امسح Service Worker والكاش ثم أعد التحميل.
    (function () {
      var BUILD_KEY = "naboo_web_build_id";
      var BUILD_URL = "naboo-build.json";

      function clearWebCaches() {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (names) {
            names.forEach(function (n) { caches.delete(n); });
          });
        }
      }

      fetch(BUILD_URL, { cache: "no-store" })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var remoteId = data && data.build_id ? String(data.build_id) : "";
          if (!remoteId) return;
          var prevId = null;
          try { prevId = localStorage.getItem(BUILD_KEY); } catch (_) {}
          if (prevId && prevId !== remoteId) {
            try { localStorage.setItem(BUILD_KEY, remoteId); } catch (_) {}
            clearWebCaches();
            var url = new URL(window.location.href);
            url.searchParams.set("_v", remoteId.replace(/[:]/g, ""));
            window.location.replace(url.toString());
            return;
          }
          try { localStorage.setItem(BUILD_KEY, remoteId); } catch (_) {}
        })
        .catch(function () {});
    })();
  </script>
</head>
<body>
  <picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>

  <script src="flutter_bootstrap.js?v=20260617b" async></script>
</body>
</html>
