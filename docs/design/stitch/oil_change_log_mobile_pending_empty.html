<script>
        // Simple Micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                btn.classList.add('opacity-80');
            });
            btn.addEventListener('touchend', () => {
                btn.classList.remove('opacity-80');
            });
        });

        // Tab Switching Simulation (Visual Only)
        const tabs = document.querySelectorAll('.flex.bg-surface-container button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-white', 'text-primary', 'shadow-sm', 'font-bold', 'border', 'border-outline-variant/30');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.remove('text-on-surface-variant');
                tab.classList.add('bg-white', 'text-primary', 'shadow-sm', 'font-bold', 'border', 'border-outline-variant/30');
            });
        });
    </script>
