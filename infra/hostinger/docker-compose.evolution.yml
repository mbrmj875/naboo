# Evolution API + PostgreSQL — واتساب Gateway لـ NaBoo
# مشروع Docker: naboo-evolution على Hostinger VPS
# الوصول العام: HTTPS عبر Traefik فقط (لا فتح 8080 للإنترنت)
# النطاق: https://evo-nrwn.srv1769126.hstgr.cloud
# n8n يبقى على http://naboo-evolution:8080 داخل Docker

services:
  postgres:
    image: postgres:15-alpine
    container_name: naboo-evolution-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: "Naboo_Evo_DB_2026!Secure"
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: naboo-evolution
    restart: unless-stopped
    depends_on:
      - postgres
    # لا ننشر 8080 على 0.0.0.0 — الوصول عبر Traefik + شبكة Docker فقط
    expose:
      - "8080"
    environment:
      # يجب أن يطابق n8n EVOLUTION_API_KEY + Supabase secret
      AUTHENTICATION_API_KEY: "Ev0_Naboo_72aB91cD3eF4gH5iJ"
      SERVER_URL: "https://evo-nrwn.srv1769126.hstgr.cloud"
      SERVER_TYPE: "http"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evolution:Naboo_Evo_DB_2026!Secure@postgres:5432/evolution?schema=public"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - default
      - traefik_proxy
    labels:
      - traefik.enable=true
      # API (Supabase / تكاملات) — بدون Basic Auth
      - traefik.http.routers.evo-api.rule=Host(`evo-nrwn.srv1769126.hstgr.cloud`) && !PathPrefix(`/manager`)
      - traefik.http.routers.evo-api.entrypoints=websecure
      - traefik.http.routers.evo-api.tls.certresolver=letsencrypt
      - traefik.http.routers.evo-api.service=evo-api
      - traefik.http.services.evo-api.loadbalancer.server.port=8080
      # Manager UI — Basic Auth
      - traefik.http.routers.evo-mgr.rule=Host(`evo-nrwn.srv1769126.hstgr.cloud`) && PathPrefix(`/manager`)
      - traefik.http.routers.evo-mgr.entrypoints=websecure
      - traefik.http.routers.evo-mgr.tls.certresolver=letsencrypt
      - traefik.http.routers.evo-mgr.service=evo-api
      - traefik.http.routers.evo-mgr.middlewares=evo-mgr-auth
      - traefik.http.middlewares.evo-mgr-auth.basicauth.users=naboo_admin:$$2y$$05$$yotxxRLiggsFf/dd.vVybuqTWKQeAmiG.lcguF/MfIgyAoXvLk8Me

volumes:
  postgres_data:
  evolution_data:

networks:
  default:
    name: naboo-evolution_default
  traefik_proxy:
    external: true
    name: traefik_proxy
